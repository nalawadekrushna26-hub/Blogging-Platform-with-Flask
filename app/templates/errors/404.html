{% extends "base.html" %}

{% block title %}404 — Page Not Found | BlogCraft{% endblock %}

{% block content %}
<div class="container error-container">
    <div class="error-card">
        <span class="error-code">404</span>
        <h1 class="error-title">Page not found</h1>
        <p class="error-desc">
            The page or article you are looking for doesn't exist, has been removed, or was unpublished by its author.
        </p>
        <div class="error-actions">
            <a href="{{ url_for('main.index') }}" class="btn btn-primary">
                <i class="fa-solid fa-house"></i> Return Home
            </a>
            <a href="{{ url_for('posts.list_posts') }}" class="btn btn-outline">
                <i class="fa-solid fa-compass"></i> Explore Articles
            </a>
        </div>
    </div>
</div>
{% endblock %}
